<style>html,body{margin:0;padding:0;background:#fff}svg{display:block}</style><style>
.sheet-nav{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:5}
.sheet-nav a,.sheet-nav button{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:7px 13px;border-radius:999px;border:1px solid #E4DBCB;background:#fff;color:#0E5C58;cursor:pointer;text-decoration:none}
.sheet-nav a:hover,.sheet-nav button:hover{border-color:#D9663B}
body{display:flex;justify-content:center;background:#EDE7DA}
svg{box-shadow:0 10px 40px -12px rgba(20,40,38,.3);margin:24px 0}
@media print{.sheet-nav{display:none}body{background:#fff}svg{box-shadow:none;margin:0;width:210mm;height:297mm}@page{size:A4 portrait;margin:0}}

/* Screen-only motion. Runtime classes leave the source A4 artwork unchanged. */
svg .signal-flow{pointer-events:none;fill:none;stroke-linecap:round;stroke-dasharray:4 14;stroke-width:3;opacity:0;filter:drop-shadow(0 0 3px currentColor);animation:signalTravel 3.2s linear infinite;animation-delay:var(--delay,0s)}
svg .main-signal{stroke:#D9663B}
svg .attention-signal{stroke:#6C5CE7}
svg .residual-signal{stroke:#2E9E5B}
svg .module-live{animation:moduleGlow 7.2s ease-in-out infinite;animation-delay:var(--delay,0s)}
svg .head-live{animation:headGlow 3.8s ease-in-out infinite;animation-delay:var(--delay,0s)}
svg .add-live{animation:addGlow 4.2s ease-in-out infinite;animation-delay:var(--delay,0s)}
svg .neuron-line-live{animation:neuronLine 3.4s ease-in-out infinite;animation-delay:var(--delay,0s)}
svg .neuron-node-live{animation:neuronNode 3.4s ease-in-out infinite;animation-delay:var(--delay,0s)}
svg .encoder-frame-live{animation:frameBreathe 5.8s ease-in-out infinite}

@keyframes signalTravel{
  0%{stroke-dashoffset:36;opacity:0}
  18%{opacity:.9}
  72%{opacity:.72}
  100%{stroke-dashoffset:-36;opacity:0}
}
@keyframes moduleGlow{
  0%,12%,48%,100%{filter:none}
  24%,36%{filter:drop-shadow(0 0 8px rgba(217,102,59,.58))}
}
@keyframes headGlow{
  0%,100%{filter:none;opacity:.78}
  45%,60%{filter:drop-shadow(0 0 6px rgba(108,92,231,.72));opacity:1}
}
@keyframes addGlow{
  0%,100%{filter:none}
  50%{filter:drop-shadow(0 0 8px rgba(217,102,59,.82))}
}
@keyframes neuronLine{
  0%,100%{opacity:.28}
  50%{opacity:1;filter:drop-shadow(0 0 2px rgba(217,102,59,.42))}
}
@keyframes neuronNode{
  0%,100%{filter:none}
  50%{filter:drop-shadow(0 0 6px rgba(14,92,88,.58))}
}
@keyframes frameBreathe{
  0%,100%{stroke-opacity:.72}
  50%{stroke-opacity:1;filter:drop-shadow(0 0 5px rgba(14,92,88,.22))}
}

@media print{
  svg .signal-flow{display:none!important}
  svg .module-live,svg .head-live,svg .add-live,svg .neuron-line-live,svg .neuron-node-live,svg .encoder-frame-live{animation:none!important;filter:none!important;opacity:1!important}
}
@media (prefers-reduced-motion:reduce){
  svg .signal-flow{display:none!important}
  svg .module-live,svg .head-live,svg .add-live,svg .neuron-line-live,svg .neuron-node-live,svg .encoder-frame-live{animation:none!important;filter:none!important;opacity:1!important}
}

<script>
(function(){
  const svg = document.querySelector('svg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!svg || reduceMotion.matches) return;

  const number = (element, name) => Number(element.getAttribute(name));
  const delay = (element, seconds) => element.style.setProperty('--delay', seconds + 's');

  function addSignal(element, kind, seconds){
    const overlay = element.cloneNode(false);
    overlay.removeAttribute('marker-end');
    overlay.removeAttribute('stroke-dasharray');
    overlay.setAttribute('aria-hidden', 'true');
    overlay.classList.add('signal-flow', kind);
    delay(overlay, seconds);
    element.parentNode.insertBefore(overlay, element.nextSibling);
  }

  const markerLines = [...svg.querySelectorAll('line[marker-end]')];

  const mainLines = markerLines.filter(line => {
    const x1 = number(line, 'x1'), x2 = number(line, 'x2');
    const y1 = number(line, 'y1'), y2 = number(line, 'y2');
    const central = x1 === 330 && x2 === 330 && y1 < 1265;
    const positionInput = y1 === 420 && y2 === 420;
    const outputSplit = y1 === 1264 && y2 === 1296;
    return central || positionInput || outputSplit;
  });
  mainLines.forEach((line, index) => addSignal(line, 'main-signal', index * .17));

  const residualPaths = [...svg.querySelectorAll('path[stroke="#2E9E5B"][marker-end]')];
  residualPaths.forEach((path, index) => addSignal(path, 'residual-signal', .8 + index * 1.1));

  const attentionLines = markerLines.filter(line => {
    const x1 = number(line, 'x1'), x2 = number(line, 'x2');
    const y1 = number(line, 'y1'), y2 = number(line, 'y2');
    return Math.max(x1, x2) >= 670 && Math.max(y1, y2) < 900;
  });
  attentionLines.forEach((line, index) => addSignal(line, 'attention-signal', index * .11));
  svg.querySelectorAll('path[stroke="#6C5CE7"][marker-end]').forEach((path, index) => {
    addSignal(path, 'attention-signal', .35 + index * .4);
  });

  const moduleSelectors = [
    'rect[x="130"][y="250"]',
    'rect[x="130"][y="328"]',
    'rect[x="140"][y="548"]',
    'rect[x="190"][y="746"]',
    'rect[x="140"][y="840"]',
    'rect[x="190"][y="1106"]',
    'rect[x="130"][y="1206"]'
  ];
  moduleSelectors.forEach((selector, index) => {
    const module = svg.querySelector(selector);
    if (!module) return;
    module.classList.add('module-live');
    delay(module, index * .72);
  });

  const encoderFrame = svg.querySelector('rect[x="60"][y="512"]');
  if (encoderFrame) encoderFrame.classList.add('encoder-frame-live');

  svg.querySelectorAll('circle[stroke="#D9663B"]').forEach((circle, index) => {
    circle.classList.add('add-live');
    delay(circle, index * .65);
  });

  svg.querySelectorAll('rect[y="690"][width="50"][height="66"]').forEach((head, index) => {
    head.classList.add('head-live');
    delay(head, index * .22);
  });

  svg.querySelectorAll('rect[x="710"][y="222"],rect[x="870"][y="222"],rect[x="1030"][y="222"],rect[x="740"][width="250"]').forEach((box, index) => {
    box.classList.add('head-live');
    delay(box, index * .3);
  });

  svg.querySelectorAll('line[stroke="#E8C9A0"]').forEach((line, index) => {
    line.classList.add('neuron-line-live');
    delay(line, (index % 8) * .16);
  });
  svg.querySelectorAll('circle[cx="732"],circle[cx="1118"]').forEach((node, index) => {
    node.classList.add('neuron-node-live');
    delay(node, index * .2);
  });
})();
</script>
