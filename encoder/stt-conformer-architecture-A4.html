<text x="50" y="130" font-family="'JetBrains Mono',monospace" font-size="12.5" fill="#4C5658">Worked CTC example: 5 s · 16 kHz · 80 Mel bins · d_model 256 · 4 heads · d_ff 1024 · 16 blocks · conv kernel 32</text>

<line class="flow-line" data-step="5" x1="330" y1="594" x2="330" y2="618" stroke="#4C5658" stroke-width="1.8" marker-end="url(#arrow)"/>

<text x="241" y="714" font-family="'JetBrains Mono',monospace" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">CONFORMER BLOCK × N = 16</text>

  <g fill="#6C5CE7"><rect class="head-live" style="--delay:0s" x="235" y="902" width="38" height="10" rx="3"/><rect class="head-live" style="--delay:.2s" x="284" y="902" width="38" height="10" rx="3"/><rect class="head-live" style="--delay:.4s" x="333" y="902" width="38" height="10" rx="3"/><rect class="head-live" style="--delay:.6s" x="382" y="902" width="38" height="10" rx="3"/></g>
</g>
<line class="flow-line" data-step="8" x1="330" y1="924" x2="330" y2="948" stroke="#4C5658" stroke-width="1.8" marker-end="url(#arrow)"/>
<g class="stage" data-step="8">

  <text x="330" y="997" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4C5658" text-anchor="middle">LN → PW Conv D→2D → GLU 2D→D → depthwise Conv1d k32</text>
  <text x="330" y="1017" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4C5658" text-anchor="middle">→ BatchNorm → SiLU → PW Conv D→D → dropout</text>

<line class="flow-line" data-step="9" x1="330" y1="1062" x2="330" y2="1086" stroke="#4C5658" stroke-width="1.8" marker-end="url(#arrow)"/>

<line class="flow-line" data-step="10" x1="330" y1="1158" x2="330" y2="1172" stroke="#4C5658" stroke-width="1.8" marker-end="url(#arrow)"/>

<script>
(function(){
  if(new URLSearchParams(location.search).has('export')) document.body.classList.add('export');
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.getElementById('motionToggle');
  const steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);
  let current=-1,timer=null,paused=false;
  function show(step){
    document.querySelectorAll('[data-step].is-active').forEach(el=>el.classList.remove('is-active'));
    document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'));
  }
  function advance(){current=(current+1)%steps.length;show(steps[current])}
  function start(){if(reduce.matches||document.body.classList.contains('export'))return;advance();timer=setInterval(advance,760)}
  function stop(){clearInterval(timer);timer=null}
  toggle.addEventListener('click',()=>{
    paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';
    if(paused)stop();else start();
  });
  reduce.addEventListener('change',event=>{if(event.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});
  start();
})();
</script>
