<title id="sheetTitle">FastConformer encoder architecture</title>
<desc id="sheetDesc">A one-page A4 architecture reference for the FastConformer speech encoder: 8x depthwise-separable subsampling, the Macaron block with a kernel-9 convolution module, frame-rate and attention-cost comparisons with Conformer, limited-context attention with a global token, and deployment notes for Parakeet CTC, RNN-T and TDT models.</desc>

<!-- Section B: frame rate and attention cost -->
<text x="50" y="450" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D9663B" font-weight="600">WHY 8× MATTERS · FRAME RATE AND ATTENTION COST</text>

  <text x="70" y="494" font-family="Fraunces,Georgia,serif" font-size="19" fill="#093F3C" font-weight="600">Same 320 ms of speech, three time grids</text>
  <text x="70" y="517" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#4C5658">each cell is one vector the next layer must process</text>
  <text x="72" y="560" font-family="'JetBrains Mono',monospace" font-size="10" fill="#093F3C" font-weight="600">log-Mel T</text>
  <text x="72" y="576" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7E8888">10 ms · 32 cells</text>
  <rect x="190" y="546" width="400" height="30" fill="url(#gridMel)"/>
  <text x="72" y="616" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E5C58" font-weight="600">Conformer 4×</text>
  <text x="72" y="632" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7E8888">40 ms · 8 cells</text>
  <rect x="190" y="602" width="400" height="30" fill="url(#gridConf)"/>
  <text x="72" y="672" font-family="'JetBrains Mono',monospace" font-size="10" fill="#D9663B" font-weight="600">FastConf 8×</text>
  <text x="72" y="688" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7E8888">80 ms · 4 cells</text>
  <rect class="pulse" x="190" y="658" width="400" height="30" fill="url(#gridFast)"/>
  <g font-family="'JetBrains Mono',monospace" font-size="9" fill="#D9663B" text-anchor="middle"><text x="240" y="677">80 ms</text><text x="340" y="677">80 ms</text><text x="440" y="677">80 ms</text><text x="540" y="677">80 ms</text></g>
  <rect x="72" y="710" width="518" height="44" rx="9" fill="#0E2A28"/>
  <text x="88" y="728" font-family="'JetBrains Mono',monospace" font-size="9.2" fill="#F2C879" font-weight="600">10 s → 1000 mel → 250 (4×) vs 125 (8×) encoder frames</text>
  <text x="88" y="745" font-family="'JetBrains Mono',monospace" font-size="9" fill="#CFE9E4">FFN and conv cost scale with T′ → about 2× less work per layer</text>
</g>

  <rect x="660" y="540" width="180" height="180" fill="url(#gridAttn)"/>

  <text x="795" y="690" font-family="'JetBrains Mono',monospace" font-size="10" fill="#093F3C" text-anchor="middle" font-weight="600">250²</text>
  <text x="750" y="738" font-family="'JetBrains Mono',monospace" font-size="8.8" fill="#7E8888" text-anchor="middle">queries × keys · per layer, per head</text>
  <text x="868" y="560" font-family="'JetBrains Mono',monospace" font-size="10" fill="#0E5C58" font-weight="600">CONFORMER 4×</text>
  <text x="868" y="578" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#22282A">250 × 250 = 62,500 scores</text>
  <text x="868" y="612" font-family="'JetBrains Mono',monospace" font-size="10" fill="#D9663B" font-weight="600">FASTCONFORMER 8×</text>
  <text x="868" y="630" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#22282A">125 × 125 = 15,625 scores</text>
  <rect x="866" y="650" width="304" height="40" rx="9" fill="#DFF1E5" stroke="#2E9E5B"/>
  <text x="1018" y="675" font-family="'JetBrains Mono',monospace" font-size="11" fill="#2E9E5B" text-anchor="middle" font-weight="600">½ the frames → ¼ the scores</text>
  <text x="868" y="712" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4C5658">also ¼ attention-matrix memory</text>
  <text x="868" y="730" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4C5658">paper: ≈2.8× faster than Conformer,</text>
  <text x="868" y="746" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4C5658">with similar WER</text>
</g>

  <!-- Conv module -->

<script>
(function(){
  if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.getElementById('motionToggle');
  const steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);
  let current=-1,timer=null,paused=false;
  function show(step){document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'));document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'))}
  function advance(){current=(current+1)%steps.length;show(steps[current])}
  function start(){if(reduce.matches||document.body.classList.contains('export'))return;advance();timer=setInterval(advance,900)}
  function stop(){clearInterval(timer);timer=null}
  toggle.addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';paused?stop():start()});
  reduce.addEventListener('change',event=>{if(event.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});
  start();
})();
</script>
