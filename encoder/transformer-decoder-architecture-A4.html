<script>
(function(){if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');const reduce=matchMedia('(prefers-reduced-motion: reduce)'),toggle=document.getElementById('motionToggle'),steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);let current=-1,timer=null,paused=false;function show(step){document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'));document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'))}function advance(){current=(current+1)%steps.length;show(steps[current])}function start(){if(reduce.matches||document.body.classList.contains('export'))return;advance();timer=setInterval(advance,800)}function stop(){clearInterval(timer);timer=null}toggle.addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';paused?stop():start()});reduce.addEventListener('change',e=>{if(e.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});start()})();
