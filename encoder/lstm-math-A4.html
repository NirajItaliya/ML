<desc id="sheetDesc">A one-page A4 reference for the LSTM: the cell diagram with its four gates and equations, the stacked-matrix forward pass with shapes, the backpropagation-through-time equations for one step, and a two-step scalar example worked line by line with its meaning, followed by one backward step through the cell state.</desc>

  <text class="m" x="612" y="1210" font-size="9.5" fill="#3d3380">reveal</text>
  <text class="m" x="612" y="1222" font-size="9.5" fill="#3d3380">o_t ⊙ tanh(c_t)</text>

<!-- equations -->
<g class="m">
  <text x="712" y="918" font-size="10.5" fill="#7E8888" font-weight="600">EQUATIONS · W_* has shape (H, H+d)</text>
  <g class="stage" data-step="0">
    <rect x="712" y="928" width="458" height="40" rx="9" fill="#F7E4D8"/>
    <text x="726" y="952" font-size="12.5" fill="#22282A"><tspan fill="#D9663B" font-weight="600">f_t</tspan> = σ(W_f·[h_{t−1}, x_t] + b_f)</text>
    <text x="1158" y="952" font-size="9.5" fill="#8a3f1e" text-anchor="end">what to erase</text>
  </g>
  <g class="stage" data-step="1">
    <rect x="712" y="974" width="458" height="40" rx="9" fill="#DFF1E5"/>
    <text x="726" y="998" font-size="12.5" fill="#22282A"><tspan fill="#2E9E5B" font-weight="600">i_t</tspan> = σ(W_i·[h_{t−1}, x_t] + b_i)</text>
    <text x="1158" y="998" font-size="9.5" fill="#1f6b3e" text-anchor="end">how much to write</text>
    <rect x="712" y="1020" width="458" height="40" rx="9" fill="#F3EAD3"/>
    <text x="726" y="1044" font-size="12.5" fill="#22282A"><tspan fill="#9a7a1e" font-weight="600">g_t</tspan> = tanh(W_g·[h_{t−1}, x_t] + b_g)</text>
    <text x="1158" y="1044" font-size="9.5" fill="#7a5f12" text-anchor="end">what to write</text>
  </g>
  <g class="stage" data-step="2">
    <rect x="712" y="1066" width="458" height="40" rx="9" fill="#ECEAFB"/>
    <text x="726" y="1090" font-size="12.5" fill="#22282A"><tspan fill="#6C5CE7" font-weight="600">o_t</tspan> = σ(W_o·[h_{t−1}, x_t] + b_o)</text>
    <text x="1158" y="1090" font-size="9.5" fill="#3d3380" text-anchor="end">what to reveal</text>
  </g>
  <rect x="712" y="1112" width="458" height="40" rx="9" fill="#E3EEEC" stroke="#0E5C58" stroke-width="1.3"/>
  <text x="726" y="1136" font-size="12.5" fill="#22282A"><tspan fill="#0E5C58" font-weight="600">c_t</tspan> = f_t ⊙ c_{t−1} + i_t ⊙ g_t</text>
  <text x="1158" y="1136" font-size="9.5" fill="#093F3C" text-anchor="end">additive update</text>
  <rect x="712" y="1158" width="458" height="40" rx="9" fill="#F7E4D8" stroke="#D9663B" stroke-width="1.3"/>
  <text x="726" y="1182" font-size="12.5" fill="#22282A"><tspan fill="#D9663B" font-weight="600">h_t</tspan> = o_t ⊙ tanh(c_t)</text>
  <text x="1158" y="1182" font-size="9.5" fill="#8a3f1e" text-anchor="end">output / next step</text>

<g class="m" font-size="10.5">
  <rect x="712" y="512" width="458" height="124" rx="10" fill="#FBF7EF" stroke="#E4DBCB"/>
  <text x="728" y="534" fill="#D9663B" font-weight="600">WHY THESE ACTIVATIONS</text>
  <text x="728" y="556" fill="#22282A">σ ∈ (0,1) for gates: a soft switch, 0 = closed, 1 = open</text>
  <text x="728" y="576" fill="#22282A">tanh ∈ (−1,1) for content: can push memory up or down</text>
  <text x="728" y="596" fill="#22282A">tanh(c_t) before o_t: keeps h_t bounded if c_t grows</text>
  <text x="728" y="622" fill="#4C5658">c_t has no squashing between steps → it can count / store</text>
</g>
<text class="m" x="50" y="678" font-size="11" fill="#7E8888" font-weight="600">B · MATHEMATICAL FORMULATION · FORWARD PASS AND BACKWARD PASS (BPTT) FOR ONE TIME STEP</text>
<g class="stage" data-step="3"><rect x="50" y="690" width="560" height="318" rx="12" fill="#0E2A28"/>
<text class="m" style="white-space:pre" x="68" y="716" font-size="10.5" fill="#F2C879" font-weight="600">FORWARD · all four gates from one matmul</text>
<text class="m" style="white-space:pre" x="68" y="740" font-size="11.5" fill="#CFE9E4">a_t = W·[h_{t−1} ; x_t] + b     W ∈ ℝ^(4H×(H+d)), b ∈ ℝ^(4H)</text>
<text class="m" style="white-space:pre" x="68" y="766" font-size="11.5" fill="#CFE9E4">[aⁱ ; aᶠ ; aᵍ ; aᵒ] = split(a_t, 4)       each ∈ ℝᴴ</text>
<text class="m" style="white-space:pre" x="68" y="792" font-size="11.5" fill="#CFE9E4">i = σ(aⁱ)   f = σ(aᶠ)   g = tanh(aᵍ)   o = σ(aᵒ)</text>
<text class="m" style="white-space:pre" x="68" y="818" font-size="11.5" fill="#CFE9E4">c_t = f ⊙ c_{t−1} + i ⊙ g</text>
<text class="m" style="white-space:pre" x="68" y="844" font-size="11.5" fill="#CFE9E4">h_t = o ⊙ tanh(c_t)</text>
<text class="m" style="white-space:pre" x="68" y="876" font-size="10.5" fill="#F2C879" font-weight="600">IDENTITIES USED IN BACKPROP</text>
<text class="m" style="white-space:pre" x="68" y="900" font-size="11.5" fill="#CFE9E4">σ′(z) = σ(z)·(1 − σ(z))      tanh′(z) = 1 − tanh²(z)</text>
<text class="m" style="white-space:pre" x="68" y="932" font-size="10.5" fill="#F2C879" font-weight="600">COST</text>
<text class="m" style="white-space:pre" x="68" y="956" font-size="11.5" fill="#CFE9E4">params = 4H(d+H+1)   ·   FLOPs/step ≈ 8H(d+H)</text>
<text class="m" style="white-space:pre" x="68" y="982" font-size="11.5" fill="#CFE9E4">d=128, H=256 → 394,240 params (+1,024 in PyTorch)</text>
</g>
<g class="stage" data-step="4"><rect x="630" y="690" width="560" height="318" rx="12" fill="#0E2A28"/>
<text class="m" style="white-space:pre" x="648" y="716" font-size="10.5" fill="#B9AEF7" font-weight="600">BACKWARD · given δh_t = ∂L/∂h_t and δc_{t+1}</text>
<text class="m" style="white-space:pre" x="648" y="740" font-size="11.5" fill="#CFE9E4">δo  = δh_t ⊙ tanh(c_t)</text>
<text class="m" style="white-space:pre" x="648" y="766" font-size="11.5" fill="#CFE9E4">δc_t = δh_t ⊙ o ⊙ (1 − tanh²c_t) + δc_{t+1} ⊙ f_{t+1}</text>
<text class="m" style="white-space:pre" x="648" y="792" font-size="11.5" fill="#CFE9E4">δf = δc_t ⊙ c_{t−1}   δi = δc_t ⊙ g   δg = δc_t ⊙ i</text>
<text class="m" style="white-space:pre" x="648" y="818" font-size="11.5" fill="#CFE9E4">δa = [δi⊙i(1−i) ; δf⊙f(1−f) ; δg⊙(1−g²) ; δo⊙o(1−o)]</text>
<text class="m" style="white-space:pre" x="648" y="844" font-size="11.5" fill="#CFE9E4">δW += δa·[h_{t−1} ; x_t]ᵀ        δb += δa</text>
<text class="m" style="white-space:pre" x="648" y="870" font-size="11.5" fill="#CFE9E4">[δh_{t−1} ; δx_t] = Wᵀ·δa       δc_{t−1} ← δc_t ⊙ f_t</text>
<text class="m" style="white-space:pre" x="648" y="902" font-size="10.5" fill="#B9AEF7" font-weight="600">THE KEY LINE</text>
<text class="m" style="white-space:pre" x="648" y="926" font-size="11.5" fill="#CFE9E4">∂c_t/∂c_{t−1} = diag(f_t)   (direct path: no W, no tanh′)</text>
<text class="m" style="white-space:pre" x="648" y="952" font-size="11.5" fill="#CFE9E4">→ over k steps the cell path scales by f_{t}·f_{t−1}·…</text>
<text class="m" style="white-space:pre" x="648" y="978" font-size="11.5" fill="#CFE9E4">→ f ≈ 1 keeps the gradient alive; RNN gets (W·tanh′)ᵏ</text>
</g>
<text class="m" x="50" y="1036" font-size="11" fill="#7E8888" font-weight="600">C · ONE EXAMPLE, LINE BY LINE · 1-UNIT LSTM · SEQUENCE x = [+1, −1] · START h₀ = 0, c₀ = 0 · MADE-UP WEIGHTS</text>

  <text x="68" y="1436" fill="#F2C879" font-weight="600">ONE BACKWARD STEP · suppose the loss is L = h₂</text>
  <text x="68" y="1462">δc₂ = o₂ · (1 − tanh²c₂) = 0.338 · (1 − 0.001) = <tspan fill="#7FD1E8">0.338</tspan></text>
  <text x="68" y="1486">δc₁ (cell path) = δc₂ · f₂ = 0.338 · 0.429 = <tspan fill="#7FD1E8">0.145</tspan></text>

<text class="m" x="180" y="1712" font-size="9.5" fill="#fff">a = W[h;x]+b → i,f,o = σ, g = tanh → c = f⊙c + i⊙g → h = o⊙tanh(c) · backward: δc_(t−1) = δc_t ⊙ f_t, so f controls how far memory and gradient travel</text>

<script>
(function(){
  const exportMode=new URLSearchParams(location.search).has('export');
  if(exportMode)document.body.classList.add('export');
  const svg=document.querySelector('svg');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.getElementById('motionToggle');
  const steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);
  let current=-1,timer=null,paused=false;
  function show(step){document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'));document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'))}
  function advance(){current=(current+1)%steps.length;show(steps[current])}
  function start(){if(reduce.matches||exportMode){svg.pauseAnimations();return}svg.unpauseAnimations();advance();timer=setInterval(advance,900)}
  function stop(){clearInterval(timer);timer=null;svg.pauseAnimations()}
  toggle.addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';paused?stop():start()});
  reduce.addEventListener('change',event=>{if(event.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});
  start();
})();
</script>
