<title id="sheetTitle">Whisper speech recognition architecture</title>
<desc id="sheetDesc">A one-page A4 reference for OpenAI Whisper: the 30-second log-Mel front end, the two-convolution stem, the Transformer encoder and decoder with cross-attention, a shape trace for large-v3, the multitask special-token format, model sizes, beam search with temperature fallback, and why Whisper is not a streaming model compared with a FastConformer RNN-T.</desc>

<text x="50" y="58" class="m" font-size="13" fill="#D9663B" font-weight="600">SPEECH AI · OPENAI WHISPER · RADFORD ET AL. 2022 · arXiv 2212.04356</text>
<text x="50" y="99" class="s" font-size="32" fill="#093F3C">Whisper: an encoder–decoder Transformer for speech</text>
<text x="50" y="130" class="m" font-size="12" fill="#4C5658">Worked example · one 30 s window · 16 kHz · trained on 680k h of weakly labelled web audio (v3: 1M h labelled + 4M h pseudo-labelled) · 99 languages</text>

<!-- Section A: end-to-end path -->
<text x="50" y="177" class="m" font-size="11" fill="#7E8888" font-weight="600">END-TO-END PATH · AUDIO → FEATURES → ENCODER → DECODER → TEXT TOKENS</text>

<text x="72" y="318" class="m" font-size="9.5" fill="#7E8888" font-weight="600">FRONT-END DETAIL · whisper/audio.py · every input becomes exactly 3000 mel frames → 1500 encoder frames</text>
<g class="stage" data-step="1">
  <rect x="72" y="328" width="268" height="66" rx="10" fill="#E2EEF9" stroke="#2E86DE"/>
  <text x="206" y="349" class="m" font-size="10" fill="#093F3C" text-anchor="middle" font-weight="600">pad or trim to 30 s</text>
  <text x="206" y="367" class="m" font-size="9" fill="#4C5658" text-anchor="middle">16,000 × 30 = 480,000 samples</text>
  <text x="206" y="384" class="m" font-size="9" fill="#D9663B" text-anchor="middle" font-weight="600">a 2 s clip is zero-padded too</text>
  <line x1="340" y1="361" x2="352" y2="361" stroke="#4C5658" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="356" y="328" width="268" height="66" rx="10" fill="#E2EEF9" stroke="#2E86DE"/>
  <text x="490" y="349" class="m" font-size="10" fill="#093F3C" text-anchor="middle" font-weight="600">STFT · Hann window</text>
  <text x="490" y="367" class="m" font-size="9" fill="#4C5658" text-anchor="middle">n_fft 400 (25 ms) · hop 160 (10 ms)</text>
  <text x="490" y="384" class="m" font-size="9" fill="#2E86DE" text-anchor="middle" font-weight="600">→ 3000 frames × 201 bins</text>
  <line x1="624" y1="361" x2="636" y2="361" stroke="#4C5658" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="328" width="268" height="66" rx="10" fill="#E2EEF9" stroke="#2E86DE"/>
  <text x="774" y="349" class="m" font-size="10" fill="#093F3C" text-anchor="middle" font-weight="600">80 mel filters → log10</text>
  <text x="774" y="367" class="m" font-size="9" fill="#4C5658" text-anchor="middle">clamp to (max − 8) · then (x + 4) / 4</text>
  <text x="774" y="384" class="m" font-size="9" fill="#2E86DE" text-anchor="middle" font-weight="600">→ (80, 3000), about −1 … 1</text>
</g>
<g class="stage" data-step="2">
  <line x1="908" y1="361" x2="920" y2="361" stroke="#4C5658" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="1046" y="384" class="m" font-size="9" fill="#D9663B" text-anchor="middle" font-weight="600">(d, 1500) · 20 ms / frame</text>
</g>

<!-- Section B: architecture -->
<text x="50" y="442" class="m" font-size="11" fill="#D9663B" font-weight="600">THE MODEL · A STANDARD PRE-LN TRANSFORMER · THE ENCODER READS AUDIO, THE DECODER WRITES TOKENS</text>

  <circle cx="96" cy="844" r="7" fill="#fff" stroke="#C9A24B" stroke-width="1.6"/><text x="96" y="848" class="m" font-size="10" fill="#C9A24B" text-anchor="middle">+</text>

  <text x="452" y="680" class="m" font-size="8.6" fill="#4C5658">causal · token t sees ≤ t · KV cache</text>
  <line x1="549" y1="692" x2="549" y2="702" stroke="#6C5CE7" stroke-width="1.6"/><line x1="549" y1="702" x2="428" y2="702" stroke="#6C5CE7" stroke-width="1.6"/>

  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.getElementById('motionToggle');
  const steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);
  let current=-1,timer=null,paused=false;
  function show(step){document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'));document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'))}
  function advance(){current=(current+1)%steps.length;show(steps[current])}
  function start(){if(reduce.matches||document.body.classList.contains('export'))return;advance();timer=setInterval(advance,900)}
  function stop(){clearInterval(timer);timer=null}
  toggle.addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';paused?stop():start()});
  reduce.addEventListener('change',event=>{if(event.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});
  start();
})();
</script>
</body>
</html>
