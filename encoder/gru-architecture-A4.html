<title id="sheetTitle">GRU architecture</title>
<desc id="sheetDesc">A one-page A4 reference for the Gated Recurrent Unit: the GRU cell with reset gate, update gate and candidate state, its equations, a worked scalar step, the update gate as an interpolation between old and new state, a mapping from LSTM gates to GRU gates, paper versus PyTorch conventions, parameter counts and deployment notes.</desc>

<text class="d" x="50" y="99" font-size="32" fill="#093F3C">GRU: two gates, one state, LSTM-level memory</text>
<text class="m" x="50" y="130" font-size="12" fill="#4C5658">Notation · x_t ∈ ℝᵈ input · h_t ∈ ℝᴴ hidden state (the only state) · r = reset gate · z = update gate · h̃ = candidate · σ = sigmoid</text>

<text class="m" x="50" y="177" font-size="11" fill="#7E8888" font-weight="600">A · GRU CELL · THE HIDDEN STATE ITSELF IS THE HIGHWAY · UPDATE GATE z BLENDS OLD AND NEW</text>

  <text class="m" x="230" y="400" font-size="9.5" fill="#3d3380">reset: how much</text>
  <text class="m" x="230" y="412" font-size="9.5" fill="#3d3380">past h̃ may see</text>
</g>
<!-- candidate -->
<g class="stage" data-step="1">
  <rect x="570" y="490" width="60" height="36" rx="8" fill="#F3EAD3" stroke="#C9A24B" stroke-width="1.8"/>
  <text class="m" x="600" y="513" font-size="12" fill="#7a5f12" text-anchor="middle">tanh</text>

  <line x1="600" y1="490" x2="600" y2="416" stroke="#C9A24B" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text class="m" x="608" y="470" font-size="9.5" fill="#7a5f12">candidate</text>
</g>
<!-- update gate -->
<g class="stage" data-step="2">
  <rect x="330" y="490" width="60" height="36" rx="8" fill="#DFF1E5" stroke="#2E9E5B" stroke-width="1.8"/>
  <text class="m" x="360" y="513" font-size="14" fill="#1f6b3e" text-anchor="middle">σ</text>
  <text class="m" x="398" y="512" font-size="11" fill="#2E9E5B" font-weight="600">z_t</text>
  <line x1="360" y1="490" x2="360" y2="359" stroke="#2E9E5B" stroke-width="2"/>
  <path d="M360 400H584" fill="none" stroke="#2E9E5B" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="360" cy="400" r="4" fill="#2E9E5B"/>
  <circle cx="360" cy="345" r="14" fill="#DFF1E5" stroke="#2E9E5B" stroke-width="1.8"/>
  <text class="m" x="360" y="349" font-size="10" fill="#1f6b3e" text-anchor="middle">1−</text>
  <line x1="360" y1="331" x2="360" y2="288" stroke="#2E9E5B" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <circle cx="360" cy="270" r="15" fill="#fff" stroke="#2E9E5B" stroke-width="2"/>

  <text class="m" x="470" y="392" font-size="9.5" fill="#1f6b3e">take z</text>
</g>
<!-- combine -->
<g class="stage" data-step="3">
  <circle cx="600" cy="400" r="15" fill="#fff" stroke="#2E9E5B" stroke-width="2"/>
  <text class="m" x="600" y="405" font-size="15" fill="#2E9E5B" text-anchor="middle">×</text>
  <line x1="600" y1="385" x2="600" y2="288" stroke="#2E9E5B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="600" cy="270" r="15" fill="#fff" stroke="#0E5C58" stroke-width="2"/>
  <text class="m" x="600" y="276" font-size="17" fill="#0E5C58" text-anchor="middle">+</text>
  <text class="m" x="610" y="345" font-size="9.5" fill="#1f6b3e">z ⊙ h̃</text>
</g>

<!-- equations -->
<g class="m">
  <text x="712" y="225" font-size="10.5" fill="#7E8888" font-weight="600">EQUATIONS · W_r, W_z, W_h have shape (H, H+d)</text>
  <g class="stage" data-step="0">
    <rect x="712" y="236" width="458" height="44" rx="9" fill="#ECEAFB"/>
    <text x="726" y="263" font-size="12.5" fill="#22282A"><tspan fill="#6C5CE7" font-weight="600">r_t</tspan> = σ(W_r·[h_{t−1}, x_t] + b_r)</text>
    <text x="1158" y="263" font-size="9.5" fill="#3d3380" text-anchor="end">reset</text>
  </g>
  <g class="stage" data-step="2">
    <rect x="712" y="288" width="458" height="44" rx="9" fill="#DFF1E5"/>
    <text x="726" y="315" font-size="12.5" fill="#22282A"><tspan fill="#2E9E5B" font-weight="600">z_t</tspan> = σ(W_z·[h_{t−1}, x_t] + b_z)</text>
    <text x="1158" y="315" font-size="9.5" fill="#1f6b3e" text-anchor="end">update</text>
  </g>
  <g class="stage" data-step="1">
    <rect x="712" y="340" width="458" height="44" rx="9" fill="#F3EAD3"/>
    <text x="726" y="367" font-size="12.5" fill="#22282A"><tspan fill="#9a7a1e" font-weight="600">h̃_t</tspan> = tanh(W_h·[r_t ⊙ h_{t−1}, x_t] + b_h)</text>
    <text x="1158" y="367" font-size="9.5" fill="#7a5f12" text-anchor="end">candidate</text>
  </g>
  <g class="stage" data-step="3">
    <rect x="712" y="392" width="458" height="44" rx="9" fill="#E3EEEC" stroke="#0E5C58" stroke-width="1.3"/>
    <text x="726" y="419" font-size="12.5" fill="#22282A"><tspan fill="#0E5C58" font-weight="600">h_t</tspan> = (1 − z_t) ⊙ h_{t−1} + z_t ⊙ h̃_t</text>
    <text x="1158" y="419" font-size="9.5" fill="#093F3C" text-anchor="end">blend</text>
  </g>
  <rect x="712" y="452" width="458" height="214" rx="10" fill="#FBF7EF" stroke="#E4DBCB"/>
  <text x="728" y="476" font-size="10.5" fill="#D9663B" font-weight="600">READ THE GATES</text>
  <g font-size="10.5" fill="#22282A">
    <text x="728" y="500"><tspan fill="#2E9E5B" font-weight="600">z → 0</tspan>  h_t ≈ h_{t−1}: copy memory unchanged</text>
    <text x="728" y="520"><tspan fill="#2E9E5B" font-weight="600">z → 1</tspan>  h_t ≈ h̃_t: overwrite with new content</text>
    <text x="728" y="544"><tspan fill="#6C5CE7" font-weight="600">r → 0</tspan>  candidate ignores the past: fresh start</text>
    <text x="728" y="564"><tspan fill="#6C5CE7" font-weight="600">r → 1</tspan>  candidate is a plain RNN step</text>
    <text x="728" y="592" fill="#4C5658">gradient path: ∂h_t/∂h_{t−1} = diag(1 − z_t) + …</text>
    <text x="728" y="610" fill="#4C5658">→ an additive copy path, like LSTM's f_t path</text>
    <text x="728" y="638" fill="#4C5658">no separate cell state · no output gate</text>
    <text x="728" y="656" fill="#4C5658">h_t is exposed directly as the output</text>
  </g>
</g>

<!-- ═════ Section B: worked step + interpolation ═════ -->
<text class="m" x="50" y="718" font-size="11" fill="#7E8888" font-weight="600">B · ONE GRU STEP BY HAND · SCALAR · x = 1 · h_{t−1} = 0.5</text>
<rect x="50" y="731" width="1140" height="250" rx="16" fill="#FFFDF8" stroke="#D9D0BF" stroke-width="1.4"/>
<g class="stage" data-step="4">
  <rect x="72" y="750" width="520" height="212" rx="10" fill="#0E2A28"/>
  <g class="m" font-size="11" fill="#CFE9E4">
    <text x="90" y="776" fill="#F2C879" font-weight="600">WORKED STEP · made-up scalar weights</text>
    <text x="90" y="802">r = σ(0.5x − 0.3h + 0.1) = σ(0.45) = <tspan fill="#B9AEF7">0.611</tspan></text>
    <text x="90" y="824">z = σ(0.6x + 0.4h − 0.2) = σ(0.60) = <tspan fill="#8FE0AE">0.646</tspan></text>
    <text x="90" y="846">r ⊙ h = 0.611 · 0.5 = 0.305</text>
    <text x="90" y="868">h̃ = tanh(0.9x + 0.8·0.305) = tanh(1.144) = <tspan fill="#F2C879">0.816</tspan></text>
    <text x="90" y="894">keep = (1 − 0.646) · 0.5   = 0.177</text>
    <text x="90" y="916">new  = 0.646 · 0.816       = 0.527</text>
    <text x="90" y="942">h_t = 0.177 + 0.527 = <tspan fill="#7FD1E8" font-weight="600">0.704</tspan></text>
  </g>
</g>
<g class="stage" data-step="5">
  <text class="d" x="620" y="770" font-size="16" fill="#093F3C">z is a slider between old and new</text>
  <line x1="650" y1="840" x2="1150" y2="840" stroke="#D9D0BF" stroke-width="6" stroke-linecap="round"/>
  <!-- scale: 0.4 → 650, 0.9 → 1150 : 1000 px per 1.0 -->
  <line x1="750" y1="840" x2="1066" y2="840" stroke="#2E9E5B" stroke-width="6" stroke-linecap="round" opacity=".35"/>
  <circle cx="750" cy="840" r="10" fill="#0E5C58"/>
  <text class="m" x="750" y="816" font-size="11" fill="#0E5C58" text-anchor="middle" font-weight="600">h_{t−1} = 0.500</text>
  <text class="m" x="750" y="870" font-size="9.5" fill="#4C5658" text-anchor="middle">z = 0</text>
  <circle cx="1066" cy="840" r="10" fill="#C9A24B"/>
  <text class="m" x="1066" y="816" font-size="11" fill="#9a7a1e" text-anchor="middle" font-weight="600">h̃ = 0.816</text>
  <text class="m" x="1066" y="870" font-size="9.5" fill="#4C5658" text-anchor="middle">z = 1</text>
  <path d="M946 852 L954 830 L962 852Z" fill="#D9663B"/>
  <line x1="954" y1="830" x2="954" y2="800" stroke="#D9663B" stroke-width="2"/>
  <text class="m" x="954" y="794" font-size="11.5" fill="#D9663B" text-anchor="middle" font-weight="600">h_t = 0.704 (z = 0.646)</text>
  <text class="m" x="620" y="906" font-size="10.5" fill="#22282A">h_t moves 64.6% of the way from h_{t−1} toward h̃.</text>
  <text class="m" x="620" y="926" font-size="10.5" fill="#22282A">Reset changes h̃ itself: r = 0 → h̃ = tanh(0.9) = 0.716,</text>
  <text class="m" x="620" y="946" font-size="10.5" fill="#22282A">r = 1 → h̃ = tanh(1.3) = 0.862.</text>
  <text class="m" x="620" y="966" font-size="9.5" fill="#7E8888">Interpolation keeps h_t inside [h_{t−1}, h̃] per unit, so it stays in (−1, 1).</text>
</g>

<!-- ═════ Section C: LSTM → GRU mapping ═════ -->
<text class="m" x="50" y="1009" font-size="11" fill="#7E8888" font-weight="600">C · FROM LSTM TO GRU · WHAT WAS MERGED, WHAT WAS REMOVED</text>

<script>
(function(){
  const exportMode=new URLSearchParams(location.search).has('export');
  if(exportMode)document.body.classList.add('export');
  const svg=document.querySelector('svg');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');
  const toggle=document.getElementById('motionToggle');
  const steps=[...new Set([...document.querySelectorAll('[data-step]')].map(el=>Number(el.dataset.step)))].sort((a,b)=>a-b);
  let current=-1,timer=null,paused=false;
  function show(step){document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'));document.querySelectorAll(`[data-step="${step}"]`).forEach(el=>el.classList.add('is-active'))}
  function advance(){current=(current+1)%steps.length;show(steps[current])}
  function start(){if(reduce.matches||exportMode){svg.pauseAnimations();return}svg.unpauseAnimations();advance();timer=setInterval(advance,900)}
  function stop(){clearInterval(timer);timer=null;svg.pauseAnimations()}
  toggle.addEventListener('click',()=>{paused=!paused;document.body.classList.toggle('paused',paused);toggle.setAttribute('aria-pressed',String(paused));toggle.textContent=paused?'Resume motion':'Pause motion';paused?stop():start()});
  reduce.addEventListener('change',event=>{if(event.matches){stop();document.querySelectorAll('.is-active').forEach(el=>el.classList.remove('is-active'))}else if(!paused)start()});
  start();
})();
</script>
